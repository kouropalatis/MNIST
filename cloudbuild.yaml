timeout: 1200s
steps:
  # STEP 1: Fetch Data
  - name: 'python:3.11-slim'
    id: 'Fetch Data'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install dvc[gs]
        dvc pull

  # STEP 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Training Image'
    waitFor: ['Fetch Data']
    args: [
      'build', 
      '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/container/mnist-train-image:latest',
      '-f', 'dockerfiles/train.dockerfile', 
      '.'
    ]

  # STEP 3: Push the image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    waitFor: ['Build Training Image']
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/container/mnist-train-image:latest']

  # STEP 4: Inject Secrets
  - name: "alpine"
    id: "Inject Secrets"
    waitFor: ['Push Image']
    entrypoint: "sh"
    args:
      - '-c'
      - |
        apk add --no-cache gettext
        # Use $$ so Cloud Build ignores these during the substitution phase
        export WANDB_API_KEY=$$WANDB_API_KEY
        envsubst < config.yaml > config_final.yaml
    secretEnv: ['WANDB_API_KEY']

  # STEP 5: Trigger Vertex AI
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Trigger Vertex AI'
    waitFor: ['Inject Secrets']
    args: [
      'ai', 'custom-jobs', 'create',
      '--region=${_REGION}', 
      '--display-name=mnist-train-run',
      '--config=config_final.yaml'
    ]

substitutions:
  # This must be USED in the steps above (see Step 4)
  _REGION: 'europe-west1'

availableSecrets:
  secretManager:
    - versionName: projects/black-monitor-484210-s3/secrets/WANDB_API_KEY/versions/latest
      env: 'WANDB_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
  # This prevents the build from failing if a substitution is defined but not used
  substitution_option: 'ALLOW_LOOSE'